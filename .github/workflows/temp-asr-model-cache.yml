name: Temporary ASR model cache

on:
  push:
    branches:
      - temp/asr-model-cache-20260813
    paths:
      - .github/workflows/temp-asr-model-cache.yml

permissions:
  contents: read

jobs:
  small:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download Whisper small multilingual Q5_1
        run: |
          set -euo pipefail
          curl -L --fail --retry 8 --retry-delay 5 --retry-all-errors \
            -o ggml-small-q5_1.bin \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin?download=true'
          echo 'ae85e4a935d7a567bd102fe55afc16bb595bdb618e11b2fc7591bc08120411bb  ggml-small-q5_1.bin' | sha256sum -c -
          ls -lh ggml-small-q5_1.bin
      - uses: actions/upload-artifact@v4
        with:
          name: whisper-small-q5_1
          path: ggml-small-q5_1.bin
          compression-level: 0
          retention-days: 1

  medium:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download Whisper medium multilingual Q5_0
        run: |
          set -euo pipefail
          curl -L --fail --retry 8 --retry-delay 5 --retry-all-errors \
            -o ggml-medium-q5_0.bin \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-medium-q5_0.bin?download=true'
          echo '19fea4b380c3a618ec4723c3eef2eb785ffba0d0538cf43f8f235e7b3b34220f  ggml-medium-q5_0.bin' | sha256sum -c -
          ls -lh ggml-medium-q5_0.bin
      - uses: actions/upload-artifact@v4
        with:
          name: whisper-medium-q5_0
          path: ggml-medium-q5_0.bin
          compression-level: 0
          retention-days: 1

  turbo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Download Whisper large-v3-turbo multilingual Q5_0
        run: |
          set -euo pipefail
          curl -L --fail --retry 8 --retry-delay 5 --retry-all-errors \
            -o ggml-large-v3-turbo-q5_0.bin \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin?download=true'
          echo '394221709cd5ad1f40c46e6031ca61bce88931e6e088c188294c6d5a55ffa7e2  ggml-large-v3-turbo-q5_0.bin' | sha256sum -c -
          ls -lh ggml-large-v3-turbo-q5_0.bin
      - uses: actions/upload-artifact@v4
        with:
          name: whisper-large-v3-turbo-q5_0
          path: ggml-large-v3-turbo-q5_0.bin
          compression-level: 0
          retention-days: 1
