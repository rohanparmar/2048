name: Temporary specialist ASR cache

on:
  push:
    branches:
      - temp/asr-model-cache-20260813
    paths:
      - .github/workflows/temp-asr-specialists.yml

permissions:
  contents: read

jobs:
  hindi-small:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download Hindi-finetuned Whisper small Q5_1
        run: |
          set -euo pipefail
          curl -L --fail --retry 8 --retry-delay 5 --retry-all-errors \
            -o ggml-hi-small.bin \
            'https://huggingface.co/ukta-app/indic-whisper-ggml/resolve/main/ggml-hi-small.bin?download=true'
          test "$(stat -c%s ggml-hi-small.bin)" -gt 180000000
          ls -lh ggml-hi-small.bin
      - uses: actions/upload-artifact@v4
        with:
          name: whisper-hindi-small-q5_1
          path: ggml-hi-small.bin
          compression-level: 0
          retention-days: 1

  hinglish-base:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download Hinglish-finetuned Whisper base Q8_0
        run: |
          set -euo pipefail
          curl -L --fail --retry 8 --retry-delay 5 --retry-all-errors \
            -o ggml-oriserve-hinglish-q8_0.bin \
            'https://huggingface.co/anish2305/airnote-hinglish-stt-ggml/resolve/main/ggml-oriserve-hinglish-q8_0.bin?download=true'
          test "$(stat -c%s ggml-oriserve-hinglish-q8_0.bin)" -gt 70000000
          ls -lh ggml-oriserve-hinglish-q8_0.bin
      - uses: actions/upload-artifact@v4
        with:
          name: whisper-hinglish-base-q8_0
          path: ggml-oriserve-hinglish-q8_0.bin
          compression-level: 0
          retention-days: 1
